<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Portify AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#f6f8fc;--sf:#fff;--tx:#0b1220;--mu:#5b6b85;--ac:#2563eb;--bd:#dbe3f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070d1f;--sf:#0f1830;--tx:#e6ecf8;--mu:#8fa0bf;--ac:#38bdf8;--bd:#1f2d4d}}
:root[data-theme="dark"]{--bg:#070d1f;--sf:#0f1830;--tx:#e6ecf8;--mu:#8fa0bf;--ac:#38bdf8;--bd:#1f2d4d}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
header{padding:28px 20px 8px;max-width:1200px;margin:auto}h1{font-size:clamp(26px,5vw,44px);margin:0 0 6px;letter-spacing:-.02em}h1 span{color:var(--ac)}
.sub{color:var(--mu);max-width:640px;margin:0}
nav.steps{display:flex;gap:6px;flex-wrap:wrap;max-width:1200px;margin:16px auto;padding:0 20px}
nav.steps button{flex:1;min-width:110px}
main{max-width:1200px;margin:auto;padding:0 20px 40px}
button,.btn{font:inherit;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:9px 14px;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#04101f;font-weight:600}button.on{border-color:var(--ac);color:var(--ac)}
button:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px;text-transform:uppercase;letter-spacing:.05em}
input,textarea,select{width:100%;font:inherit;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px}
textarea{min-height:80px;resize:vertical}.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.warn{border-left:3px solid #f59e0b;padding:8px 12px;background:rgba(245,158,11,.1);border-radius:6px;margin:10px 0}
.err{color:#ef4444}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.design{display:grid;grid-template-columns:340px 1fr;gap:14px}
#frame{width:100%;height:72vh;border:1px solid var(--bd);border-radius:12px;background:#fff;display:block;margin:auto}
#chat{height:150px;overflow:auto;font-size:13px;border:1px solid var(--bd);border-radius:8px;padding:8px;margin-bottom:8px}
.specs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
@media(max-width:860px){.design,.g2{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Your LinkedIn Profile. <span>Reimagined by AI.</span></h1>
<p class="sub">Turn your professional profile into a personalized portfolio designed around your expertise. No account, no database: drafts stay in your browser.</p></header>
<nav class="steps" id="steps"></nav><main id="main"></main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FONTS={mono:'ui-monospace,Menlo,Consolas,monospace',sans:'system-ui,-apple-system,Segoe UI,sans-serif',serif:'Georgia,Times New Roman,serif',display:'"Trebuchet MS",system-ui,sans-serif'};
const ENUM={layout:['top','side'],hero:['terminal','dashboard','centered','code','gallery'],card:['flat','glow','terminal','outline'],bgfx:['grid','net','gradient','none'],anim:['none','subtle','scan'],font:Object.keys(FONTS)};
const SEC=['about','skills','experience','projects','education','certs','links','contact'];
const SP={
cyber:{n:'Cybersecurity',bg:'#0a1128',sf:'#141c2e',ac:'#22d3ee',tx:'#e2e8f0',mu:'#94a3b8',font:'mono',layout:'top',hero:'terminal',card:'terminal',bgfx:'grid',anim:'scan',L:{skills:'Security Skills',projects:'SOC Projects & Labs',certs:'Certifications',experience:'Incident Response & Experience',links:'GitHub & Write-ups'}},
ai:{n:'AI Engineer',bg:'#0b0620',sf:'#170f3a',ac:'#a78bfa',tx:'#ede9fe',mu:'#a5a0c8',font:'display',layout:'top',hero:'dashboard',card:'glow',bgfx:'net',anim:'subtle',L:{skills:'Technical Skills',projects:'Models & Research Projects',links:'Papers & Repos'}},
dev:{n:'Software Developer',bg:'#0d1117',sf:'#161b22',ac:'#58a6ff',tx:'#e6edf3',mu:'#8b949e',font:'mono',layout:'side',hero:'code',card:'outline',bgfx:'none',anim:'subtle',L:{projects:'Projects',links:'GitHub'}},
web:{n:'Web Developer',bg:'#fafaf9',sf:'#ffffff',ac:'#e11d48',tx:'#1c1917',mu:'#78716c',font:'display',layout:'top',hero:'centered',card:'flat',bgfx:'gradient',anim:'subtle',L:{projects:'Selected Sites'}},
ux:{n:'UI/UX Designer',bg:'#fff7ed',sf:'#ffffff',ac:'#ea580c',tx:'#292524',mu:'#78716c',font:'serif',layout:'side',hero:'gallery',card:'flat',bgfx:'gradient',anim:'subtle',L:{projects:'Case Studies',skills:'Tools & Craft'}},
data:{n:'Data Analyst',bg:'#06141b',sf:'#0e2530',ac:'#2dd4bf',tx:'#e0f2f1',mu:'#8fb3b8',font:'sans',layout:'top',hero:'dashboard',card:'outline',bgfx:'grid',anim:'none',L:{projects:'Analyses & Dashboards'}},
cloud:{n:'Cloud & DevOps',bg:'#0f172a',sf:'#1e293b',ac:'#f59e0b',tx:'#f1f5f9',mu:'#94a3b8',font:'mono',layout:'side',hero:'terminal',card:'terminal',bgfx:'net',anim:'scan',L:{projects:'Infrastructure Projects',skills:'Cloud & Tooling'}}};
const L0={about:'About',skills:'Skills',experience:'Experience',projects:'Projects',education:'Education',certs:'Certifications',links:'Links',contact:'Contact'};
const HEX=/^#[0-9a-f]{6}$/i;
function preset(k){const s=SP[k];return{spec:k,bg:s.bg,sf:s.sf,ac:s.ac,tx:s.tx,mu:s.mu,font:s.font,layout:s.layout,hero:s.hero,card:s.card,bgfx:s.bgfx,anim:s.anim,order:[...SEC],hidden:[]}}
function clean(d,base){const o={...base};if(!d||typeof d!=='object')return o;
 if(SP[d.spec])o.spec=d.spec;
 for(const k of['bg','sf','ac','tx','mu'])if(HEX.test(d[k]||''))o[k]=d[k];
 for(const k in ENUM)if(ENUM[k].includes(d[k]))o[k]=d[k];
 if(Array.isArray(d.order)){const u=[...new Set(d.order.filter(x=>SEC.includes(x)))];o.order=[...u,...SEC.filter(x=>!u.includes(x))]}
 if(Array.isArray(d.hidden))o.hidden=d.hidden.filter(x=>SEC.includes(x));return o}
const EMPTY={name:'',headline:'',email:'',summary:'',skills:'',experience:'',projects:'',education:'',certs:'',links:''};
let S={step:0,p:{...EMPTY},d:null,hist:[],redo:[],mobile:false,msg:[],note:''};
try{const x=JSON.parse(localStorage.getItem('portify_draft')||'null');if(x&&x.p){S.p={...EMPTY,...x.p};S.d=x.d?clean(x.d,preset(x.d.spec in SP?x.d.spec:'dev')):null}}catch(e){}
function save(){try{localStorage.setItem('portify_draft',JSON.stringify({p:S.p,d:S.d}))}catch(e){}}
const lines=t=>String(t||'').split('\n').map(x=>x.trim()).filter(Boolean);
const cols=l=>l.split('|').map(x=>x.trim());
function safeUrl(u){u=String(u||'').trim();return /^https?:\/\//i.test(u)?u:''}
// ---------- site renderer (static, no scripts) ----------
function site(p,d){
 const sp=SP[d.spec],lab=k=>sp.L[k]||L0[k];
 const skills=String(p.skills).split(/[,\n]/).map(x=>x.trim()).filter(Boolean);
 const exp=lines(p.experience).map(cols),pro=lines(p.projects).map(cols),edu=lines(p.education).map(cols),cer=lines(p.certs),lk=lines(p.links).map(cols);
 const has={about:!!p.summary,skills:skills.length,experience:exp.length,projects:pro.length,education:edu.length,certs:cer.length,links:lk.length,contact:!!p.email||lk.length};
 const vis=d.order.filter(k=>has[k]&&!d.hidden.includes(k));
 const a=(u,t)=>safeUrl(u)?`<a href="${esc(safeUrl(u))}" target="_blank" rel="noopener noreferrer">${esc(t)}</a>`:esc(t);
 const body={
 about:()=>`<p class="lead">${esc(p.summary)}</p>`,
 skills:()=>`<div class="tags">${skills.map(s=>`<span class="tag">${esc(s)}</span>`).join('')}</div>`,
 experience:()=>exp.map(r=>`<div class="card"><h3>${esc(r[0])}${r[1]?` · ${esc(r[1])}`:''}</h3><small>${esc(r[2]||'')}</small><p>${esc(r[3]||'')}</p></div>`).join(''),
 projects:()=>`<div class="grid">${pro.map(r=>`<div class="card hov"><h3>${a(r[2],r[0])}</h3><p>${esc(r[1]||'')}</p></div>`).join('')}</div>`,
 education:()=>edu.map(r=>`<div class="card"><h3>${esc(r[0])}</h3><small>${esc(r.slice(1).join(' · '))}</small></div>`).join(''),
 certs:()=>`<div class="grid">${cer.map(c=>`<div class="card">${esc(c)}</div>`).join('')}</div>`,
 links:()=>`<div class="tags">${lk.map(r=>`<span class="tag">${a(r[1],r[0])}</span>`).join('')}</div>`,
 contact:()=>`<p>${p.email?`<a href="mailto:${esc(p.email)}">${esc(p.email)}</a>`:''}</p>`};
 const hero={
 terminal:`<div class="term"><div class="bar"><i></i><i></i><i></i></div><p><b>$</b> whoami</p><h1>${esc(p.name)}</h1><p><b>$</b> cat role.txt</p><p class="role">${esc(p.headline)}<span class="cur"></span></p></div>`,
 dashboard:`<h1>${esc(p.name)}</h1><p class="role">${esc(p.headline)}</p><div class="stats">${[['Skills',skills.length],['Projects',pro.length],['Certifications',cer.length],['Roles',exp.length]].filter(x=>x[1]).map(x=>`<div class="card"><big>${x[1]}</big><small>${x[0]}</small></div>`).join('')}</div>`,
 centered:`<div class="ctr"><h1>${esc(p.name)}</h1><p class="role">${esc(p.headline)}</p></div>`,
 code:`<pre class="term"><b>const</b> dev = {\n  name: "${esc(p.name)}",\n  role: "${esc(p.headline)}",\n  skills: [${skills.slice(0,6).map(s=>`"${esc(s)}"`).join(', ')}]\n};</pre>`,
 gallery:`<div class="gal"><small>PORTFOLIO</small><h1>${esc(p.name)}</h1><p class="role">${esc(p.headline)}</p></div>`}[d.hero];
 const nav=vis.map(k=>`<a href="#${k}">${esc(lab(k))}</a>`).join('');
 const html=`<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(p.name)} | Portfolio</title><link rel="stylesheet" href="styles.css"></head><body class="L-${d.layout} C-${d.card} B-${d.bgfx} A-${d.anim}"><nav class="nav"><b>${esc(p.name.split(' ')[0]||'Home')}</b><div>${nav}</div></nav><div class="wrap"><section class="hero">${hero}</section>${vis.map(k=>`<section id="${k}"><h2>${esc(lab(k))}</h2>${body[k]()}</section>`).join('')}<footer>${esc(p.name)}</footer></div></body></html>`;
 const css=`:root{--bg:${d.bg};--sf:${d.sf};--ac:${d.ac};--tx:${d.tx};--mu:${d.mu}}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 ${FONTS[d.font]}}a{color:var(--ac)}
.nav{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 20px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid color-mix(in srgb,var(--ac) 25%,transparent)}.nav div{display:flex;gap:14px;overflow-x:auto}.nav a{text-decoration:none;color:var(--mu);font-size:14px;white-space:nowrap}.nav a:hover{color:var(--ac)}
.wrap{max-width:960px;margin:auto;padding:0 20px 40px}section{padding:36px 0}h1{font-size:clamp(32px,7vw,58px);margin:.2em 0;line-height:1.1}h2{color:var(--ac);font-size:22px;margin:0 0 16px}h3{margin:0 0 4px;font-size:17px}small{color:var(--mu)}.role{color:var(--mu);font-size:18px}.lead{font-size:18px}
.card{background:var(--sf);border-radius:12px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}.grid .card{margin:0}.tags{display:flex;flex-wrap:wrap;gap:8px}.tag{padding:5px 12px;border-radius:99px;border:1px solid color-mix(in srgb,var(--ac) 50%,transparent);font-size:14px}.tag a{text-decoration:none}
.hero{padding:70px 0 30px}.ctr{text-align:center}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:20px}big{display:block;font-size:34px;color:var(--ac);font-weight:700}
.term{background:var(--sf);border:1px solid color-mix(in srgb,var(--ac) 35%,transparent);border-radius:12px;padding:20px;font-family:ui-monospace,Menlo,Consolas,monospace;overflow:auto}.term b{color:var(--ac)}.term p{margin:6px 0}.bar{display:flex;gap:6px;margin-bottom:10px}.bar i{width:10px;height:10px;border-radius:50%;background:var(--mu);opacity:.5}.cur{display:inline-block;width:9px;height:1em;background:var(--ac);margin-left:4px;vertical-align:-2px;animation:bl 1s steps(1) infinite}
.gal{border-left:6px solid var(--ac);padding-left:20px}footer{text-align:center;color:var(--mu);font-size:13px;padding-top:30px}
.C-glow .card{border:1px solid color-mix(in srgb,var(--ac) 40%,transparent);box-shadow:0 0 22px color-mix(in srgb,var(--ac) 18%,transparent)}.C-outline .card{background:transparent;border:1px solid color-mix(in srgb,var(--ac) 35%,transparent)}.C-terminal .card{border:1px solid color-mix(in srgb,var(--ac) 35%,transparent);border-radius:4px;font-family:ui-monospace,Menlo,Consolas,monospace}.C-terminal h3:before{content:"> ";color:var(--ac)}.C-flat .card{box-shadow:0 1px 3px rgba(0,0,0,.12)}
.B-grid{background-image:linear-gradient(color-mix(in srgb,var(--ac) 8%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--ac) 8%,transparent) 1px,transparent 1px);background-size:36px 36px}.B-net{background-image:radial-gradient(color-mix(in srgb,var(--ac) 25%,transparent) 1.2px,transparent 1.5px);background-size:26px 26px}.B-gradient{background-image:radial-gradient(900px 400px at 80% -5%,color-mix(in srgb,var(--ac) 20%,transparent),transparent)}
.A-subtle .hov,.A-scan .hov{transition:transform .2s,box-shadow .2s}.A-subtle .hov:hover,.A-scan .hov:hover{transform:translateY(-4px)}.A-subtle section,.A-scan section{animation:up .6s both}.A-scan .term{position:relative;overflow:hidden}.A-scan .term:after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--ac);opacity:.35;animation:sc 4s linear infinite}
@keyframes bl{50%{opacity:0}}@keyframes up{from{opacity:0;transform:translateY(12px)}}@keyframes sc{from{top:0}to{top:100%}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
@media(min-width:900px){.L-side .nav{position:fixed;left:0;top:0;bottom:0;width:200px;flex-direction:column;align-items:flex-start;border:0;border-right:1px solid color-mix(in srgb,var(--ac) 25%,transparent)}.L-side .nav div{flex-direction:column}.L-side .wrap{margin-left:220px;max-width:900px}}`;
 return{html,css}}
function inline(h,c){return h.replace('<link rel="stylesheet" href="styles.css">','<style>'+c+'</style>')}
// ---------- UI ----------
const STEPS=['1 Import','2 Review','3 Design','4 Export'];
function render(){
 $('#steps').innerHTML=STEPS.map((s,i)=>`<button class="${i===S.step?'on':''}" onclick="go(${i})">${s}</button>`).join('');
 [imp,rev,des,exp][S.step]();}
function go(i){if(i>=2&&!S.p.name.trim()){S.note='Add at least a name in the Review step first.';i=1}S.step=i;render();window.scrollTo(0,0)}
function pick(k){pushH();S.d=preset(k);save();render()}
function imp(){$('#main').innerHTML=`<div class="card"><h2>Import your profile</h2>
<label>LinkedIn profile URL</label><input id="u" placeholder="https://www.linkedin.com/in/example-profile/">
<div class="row"><button class="p" onclick="chk()">Check URL</button></div><div id="um"></div>
<div class="warn">LinkedIn does not allow normal browser requests to read profile data, and this app does not bypass logins or anti-bot protection. Nothing is fetched from LinkedIn. Use one of the options below, all of which stay on your device.</div></div>
<div class="card"><h2>Alternatives</h2>
<label>Paste profile text or resume text</label><textarea id="pt" placeholder="Paste your About, Experience, Skills… here"></textarea>
<div class="row"><button class="p" id="ai" onclick="aiParse()">Organize with AI</button><button onclick="go(1)">Fill in manually</button></div><div id="am" class="sub"></div>
<label>Upload a .txt/.md resume or a Portify .json backup</label><input type="file" id="f" accept=".txt,.md,.json" onchange="upl(this)"></div>`}
function chk(){const u=$('#u').value.trim();const ok=/^https:\/\/([a-z]{2,3}\.)?linkedin\.com\/in\/[^\/\s?]+\/?(\?.*)?$/i.test(u);
 $('#um').innerHTML=ok?'<p>URL format is valid. Automatic extraction is unavailable here, so please paste your profile text or fill the form manually.</p>':'<p class="err">That does not look like a LinkedIn profile URL (expected https://www.linkedin.com/in/your-name/).</p>'}
function upl(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const t=String(r.result);
 if(f.name.endsWith('.json')){try{const j=JSON.parse(t);S.p={...EMPTY,...(j.content||{})};S.d=clean(j.design,preset(j.design&&j.design.spec in SP?j.design.spec:'dev'));save();S.note='Backup restored.';go(1)}catch(e){$('#am').textContent='Could not read that JSON file.'}}
 else{$('#pt').value=t.slice(0,20000)}};r.readAsText(f)}
async function getSample(){try{return await claude.use('sample')}catch(e){return null}}
async function aiParse(){const t=$('#pt').value.trim();if(!t){$('#am').textContent='Paste some text first.';return}
 const sm=await getSample();if(!sm){$('#am').textContent='AI is not available in this view. Use the manual form instead.';return}
 $('#ai').disabled=true;$('#am').textContent='Organizing…';
 try{const j=await sm.json(`Extract profile data ONLY from the text below. Never invent anything; leave a field empty if absent. Return JSON with string fields: name, headline, email, summary, skills (comma separated), experience (one per line: Role | Company | Period | Description), projects (one per line: Name | Description | URL), education (one per line: Degree | School | Years), certs (one per line), links (one per line: Label | URL).\n\nTEXT:\n${t.slice(0,12000)}`);
  const n={...EMPTY};for(const k in EMPTY)if(typeof j[k]==='string')n[k]=j[k];S.p=n;save();S.note='Review what the AI extracted; correct anything wrong.';go(1)}
 catch(e){$('#am').textContent='AI request failed or was declined. You can fill the form manually.';$('#ai').disabled=false}}
const F=[['name','Full name','i'],['headline','Headline','i'],['email','Contact email','i'],['summary','Professional summary','t'],['skills','Skills (comma separated)','t'],['experience','Experience, one per line: Role | Company | Period | Description','t'],['projects','Projects, one per line: Name | Description | URL','t'],['education','Education, one per line: Degree | School | Years','t'],['certs','Certifications, one per line','t'],['links','Links, one per line: Label | URL','t']];
function rev(){$('#main').innerHTML=`${S.note?`<div class="warn">${esc(S.note)}</div>`:''}<div class="card"><h2>Review and correct</h2><p class="sub">Only what you enter here appears in the portfolio. Empty fields hide their section.</p><div class="g2">${F.map(([k,l,t])=>`<div style="${t==='t'?'grid-column:1/-1':''}"><label>${l}</label>${t==='i'?`<input data-k="${k}" value="${esc(S.p[k])}">`:`<textarea data-k="${k}">${esc(S.p[k])}</textarea>`}</div>`).join('')}</div>
<label>Specialization</label><div class="specs">${Object.keys(SP).map(k=>`<button class="${S.d&&S.d.spec===k?'on':''}" onclick="readF();pick('${k}')">${SP[k].n}</button>`).join('')}</div>
<div class="row"><button class="p" onclick="readF();go(S.d?2:1);if(!S.d)S.note='Choose a specialization to continue.',render()">Generate design</button></div></div>`;S.note=''}
function readF(){document.querySelectorAll('[data-k]').forEach(e=>S.p[e.dataset.k]=e.value);save()}
function pushH(){if(S.d){S.hist.push(JSON.stringify(S.d));S.redo=[];if(S.hist.length>50)S.hist.shift()}}
function undo(){if(!S.hist.length)return;S.redo.push(JSON.stringify(S.d));S.d=JSON.parse(S.hist.pop());save();render()}
function redo(){if(!S.redo.length)return;S.hist.push(JSON.stringify(S.d));S.d=JSON.parse(S.redo.pop());save();render()}
function setD(k,v){pushH();S.d[k]=v;save();render()}
function des(){if(!S.d){S.step=1;return render()}const d=S.d;
 const sel=k=>`<label>${k}</label><select onchange="setD('${k}',this.value)">${ENUM[k].map(o=>`<option ${d[k]===o?'selected':''}>${o}</option>`).join('')}</select>`;
 $('#main').innerHTML=`<div class="design"><div><div class="card"><h2>AI design assistant</h2><div id="chat">${S.msg.map(m=>`<p><b>${m[0]}:</b> ${esc(m[1])}</p>`).join('')||'<p class="sub">Try: “make it a premium SOC dashboard”, “add subtle animations”, “create a completely different design”.</p>'}</div><div class="row" style="margin:0"><input id="ci" placeholder="Describe a change" onkeydown="if(event.key==='Enter')chat()"><button class="p" onclick="chat()">Send</button></div></div>
<div class="card"><div class="row" style="margin:0"><button onclick="undo()" ${S.hist.length?'':'disabled'}>Undo</button><button onclick="redo()" ${S.redo.length?'':'disabled'}>Redo</button><button onclick="S.mobile=!S.mobile;render()">${S.mobile?'Desktop':'Mobile'} preview</button><button onclick="pick(S.d.spec)">Reset design</button></div>
${['layout','hero','card','bgfx','anim','font'].map(sel).join('')}
<label>Accent color</label><input type="color" value="${d.ac}" onchange="setD('ac',this.value)">
<label>Sections (show/hide, reorder)</label>${d.order.map((k,i)=>`<div class="row" style="margin:2px 0"><span style="flex:1">${L0[k]}</span><button onclick="mv(${i},-1)">↑</button><button onclick="mv(${i},1)">↓</button><button class="${d.hidden.includes(k)?'':'on'}" onclick="tg('${k}')">${d.hidden.includes(k)?'Hidden':'Shown'}</button></div>`).join('')}</div></div>
<div><iframe id="frame" sandbox title="Preview" style="max-width:${S.mobile?'390px':'100%'}"></iframe><div class="row"><button class="p" onclick="go(3)">Continue to export</button></div></div></div>`;
 const r=site(S.p,d);$('#frame').srcdoc=inline(r.html,r.css)}
function mv(i,n){const o=[...S.d.order],j=i+n;if(j<0||j>=o.length)return;pushH();[o[i],o[j]]=[o[j],o[i]];S.d.order=o;save();render()}
function tg(k){pushH();const h=S.d.hidden;S.d.hidden=h.includes(k)?h.filter(x=>x!==k):[...h,k];save();render()}
function rules(t){t=t.toLowerCase();const p={};let r=[];
 const to=(k)=>{Object.assign(p,preset(k));p.order=S.d.order;p.hidden=S.d.hidden};
 if(/cyber|soc|security/.test(t)){to('cyber');r.push('Applied the cybersecurity design system.')}
 if(/terminal/.test(t)){p.hero='terminal';p.font='mono';r.push('Terminal-style hero.')}
 if(/dashboard/.test(t)){p.hero='dashboard';p.card='outline';p.bgfx='grid';r.push('Dashboard-style hero.')}
 if(/interactive/.test(t)){p.card='glow';p.anim=p.anim&&p.anim!=='none'?p.anim:'subtle';r.push('Cards now lift and glow on hover.')}
 if(/animat/.test(t)){p.anim=/no |remove/.test(t)?'none':'subtle';r.push('Animation updated.')}
 if(/recruiter|professional|clean/.test(t)){p.card='flat';p.font='sans';p.hero='centered';p.anim='none';r.push('Cleaner layout for recruiters.')}
 if(/light/.test(t)){Object.assign(p,{bg:'#ffffff',sf:'#f1f5f9',tx:'#0f172a',mu:'#475569'});r.push('Light theme.')}
 if(/different|entire layout|redesign|regenerate/.test(t)){const pk=a=>a[Math.floor(Math.random()*a.length)];p.layout=pk(ENUM.layout);p.hero=pk(ENUM.hero);p.card=pk(ENUM.card);p.bgfx=pk(ENUM.bgfx);p.font=pk(ENUM.font);r.push('New layout combination; your content is unchanged.')}
 return[p,r.join(' ')||'I did not recognize that request. Try mentioning terminal, dashboard, animations, light, recruiters, or “completely different”.']}
async function chat(){const el=$('#ci');const t=el.value.trim();if(!t)return;S.msg.push(['You',t]);let p,reply;
 const sm=await getSample();
 if(sm){try{p=await sm.json(`You edit a portfolio design config. Current: ${JSON.stringify({...S.d,order:undefined,hidden:undefined})}. Allowed keys and values: layout ${ENUM.layout}; hero ${ENUM.hero}; card ${ENUM.card}; bgfx ${ENUM.bgfx}; anim ${ENUM.anim}; font ${ENUM.font}; spec ${Object.keys(SP)}; colors bg,sf,ac,tx,mu as #rrggbb. Request: "${t}". Return JSON: {"patch":{...changed keys only},"reply":"one short sentence"}.`,{cache:false});reply=p.reply;p=p.patch}catch(e){p=null}}
 if(!p){[p,reply]=rules(t)}
 const n=clean(p,S.d);if(JSON.stringify(n)!==JSON.stringify(S.d)){pushH();S.d=n;save()}else reply=(reply||'')+' (No visible change.)';
 S.msg.push(['AI',reply||'Done.']);render()}
async function dl(name,data){const d=await claude.use('downloads');if(!d){$('#xm').textContent='Downloads are unavailable in this view.';return}
 try{await d.save({filename:name,data});$('#xm').textContent='Saved '+name}catch(e){$('#xm').textContent=e&&e.code==='declined'?'Download canceled.':'Download failed: '+(e&&e.message||e)}}
function exp(){if(!S.d)return go(1);$('#main').innerHTML=`<div class="card"><h2>Export</h2><p class="sub">The ZIP is a standalone static website (HTML + CSS, no scripts, no editor dependency). The JSON lets you restore and keep editing later.</p><div class="row"><button class="p" onclick="zip()">Download website (ZIP)</button><button onclick="cfg()">Download configuration (JSON)</button><button onclick="go(2)">Back to design</button></div><p id="xm"></p></div>`}
async function zip(){if(!window.JSZip){$('#xm').textContent='ZIP library failed to load.';return}const r=site(S.p,S.d),z=new JSZip();
 z.file('index.html',r.html);z.file('styles.css',r.css);z.file('portfolio.json',JSON.stringify(conf(),null,2));
 z.file('README.txt','Hosting\n=======\nUpload every file in this folder to any static host (GitHub Pages, Netlify, Cloudflare Pages, S3) or open index.html locally.\nportfolio.json can be re-imported into Portify to keep editing.\n');
 await dl('portfolio.zip',await z.generateAsync({type:'uint8array'}))}
const conf=()=>({app:'portify',version:1,specialization:S.d.spec,content:S.p,design:S.d,sectionOrder:S.d.order});
function cfg(){dl('portfolio.json',JSON.stringify(conf(),null,2))}
render();
</script></body></html>
